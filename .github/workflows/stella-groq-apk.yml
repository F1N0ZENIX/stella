name: Stella Groq Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'packages/mobile/**'
      - 'packages/theme/**'
      - 'packages/contracts/**'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/stella-groq-apk.yml'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JAVA_TOOL_OPTIONS: '-XX:MaxMetaspaceSize=768m'
      GRADLE_OPTS: '-Xmx1024m -XX:MaxMetaspaceSize=512m'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Generate mobile translations
        run: bun run i18n:sync
        working-directory: packages/mobile
      - name: Generate native Android project
        run: bunx expo prebuild --platform android --no-install
        working-directory: packages/mobile
        env:
          EXPO_NO_TELEMETRY: '1'
          EXPO_NO_CAPABILITY_SYNC: '1'
      - name: Configure Gradle memory and ARM64-only build
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=in-process
          reactNativeArchitectures=arm64-v8a
          EOF
        working-directory: packages/mobile
      - name: Diagnose Expo autolinking before Gradle
        working-directory: packages/mobile
        run: |
          echo "Node: $(node --version)"
          echo "Expo autolinking module:"
          node -p "require.resolve('expo-modules-autolinking/package.json')"
          echo "Expo autolinking resolve:"
          bunx --no-install expo-modules-autolinking resolve --platform android --json > /tmp/stella-autolinking.json
          test -s /tmp/stella-autolinking.json
          echo "Expo autolinking completed successfully"
      - name: Build standalone APK
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --no-parallel --info --stacktrace -PreactNativeArchitectures=arm64-v8a
        working-directory: packages/mobile/android
      - name: Rename APK
        run: |
          mkdir -p dist
          cp packages/mobile/android/app/build/outputs/apk/release/app-release.apk "dist/Stella Groq release 0.2.0.apk"
          sha256sum "dist/Stella Groq release 0.2.0.apk" > dist/SHA256SUMS.txt
      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Stella-Groq-Android-APK
          path: dist/*
          if-no-files-found: error
      - name: Publish development release
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-dev-${GITHUB_RUN_NUMBER}" dist/* --title "Stella Groq Android dev ${GITHUB_RUN_NUMBER}" --notes "Compilação experimental automática. O backend original ainda não foi substituído e a Groq ainda não está integrada à interface principal. Não use como versão estável." --prerelease
