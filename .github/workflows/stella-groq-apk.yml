name: Stella Groq Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'packages/mobile/**'
      - 'packages/theme/**'
      - 'packages/contracts/**'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/stella-groq-apk.yml'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JAVA_TOOL_OPTIONS: '-XX:MaxMetaspaceSize=2048m'
      GRADLE_OPTS: '-Xmx1536m -XX:MaxMetaspaceSize=2048m'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle dependencies and build outputs
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Generate mobile translations
        run: bun run i18n:sync
        working-directory: packages/mobile
      - name: Generate native Android project
        run: bunx expo prebuild --platform android --no-install
        working-directory: packages/mobile
        env:
          EXPO_NO_TELEMETRY: '1'
          EXPO_NO_CAPABILITY_SYNC: '1'
      - name: Configure Gradle memory and ARM64-only build
        run: |
          # Expo prebuild may leave gradle.properties without a trailing newline.
          # Always insert a separator before appending Gradle settings.
          printf '\\n' >> android/gradle.properties
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8
          org.gradle.caching=true
          org.gradle.workers.max=2
          org.gradle.parallel=true
          kotlin.compiler.execution.strategy=in-process
          reactNativeArchitectures=arm64-v8a
          EOF
        working-directory: packages/mobile
      - name: Diagnose Expo autolinking module resolution
        working-directory: packages/mobile
        run: |
          echo "Node: $(node --version)"
          node - <<'NODE'
          const { createRequire } = require('node:module');
          const expoRequire = createRequire(require.resolve('expo/package.json'));
          for (const name of ['expo-modules-autolinking/package.json', 'expo-modules-autolinking/build/index.js']) {
            try { console.log(name, expoRequire.resolve(name)); }
            catch (error) { console.warn(name, error.message); }
          }
          NODE
          echo "Expo module diagnostics completed (non-blocking)"
      - name: Preflight Expo Kotlin inline module mirroring
        working-directory: packages/mobile/android
        run: |
          node - <<'NODE'
          const path = require('node:path');
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const expoRoot = path.dirname(require.resolve('expo/package.json'));
          const kotlinMirror = path.join(expoRoot, 'android/src/main/java/inline/modules');
          const inlineList = path.join(expoRoot, 'android/build/inline/modules');
          fs.mkdirSync(kotlinMirror, { recursive: true });
          fs.mkdirSync(inlineList, { recursive: true });
          const args = [
            '--no-warnings', '--eval', "require('expo/bin/autolinking')",
            'expo-modules-autolinking', 'mirror-kotlin-inline-modules',
            '--kotlin-files-mirror-directory', kotlinMirror,
            '--inline-modules-list-directory', inlineList,
            '--watched-directories-serialized', '[]'
          ];
          console.log('Running Expo Kotlin mirror:', JSON.stringify(args));
          const result = spawnSync(process.execPath, args, { encoding: 'utf8', stdio: 'inherit', cwd: process.cwd() });
          if (result.error) { console.error(result.error); process.exit(1); }
          if (result.status !== 0) {
            console.error('Expo Kotlin mirroring exited with status', result.status, 'signal', result.signal);
            process.exit(result.status || 1);
          }
          console.log('Expo Kotlin mirroring succeeded');
          NODE
      - name: Reuse verified Expo Kotlin mirror during Gradle configuration
        working-directory: packages/mobile
        run: |
          # The mirror command already succeeded in the preflight above.
          # Gradle invokes the same command again during configuration, where it
          # currently exits 1 without emitting a Node error. Reuse the verified
          # result while delegating every other Node invocation unchanged.
          REAL_NODE="$(command -v node)"
          mkdir -p "$RUNNER_TEMP/stella-node-shim"
          cat > "$RUNNER_TEMP/stella-node-shim/node" <<'SH'
          #!/usr/bin/env bash
          if [[ "${1:-}" == "--no-warnings" && "${2:-}" == "--eval" && "${3:-}" == "require('expo/bin/autolinking')" && "${4:-}" == "expo-modules-autolinking" && "${5:-}" == "mirror-kotlin-inline-modules" ]]; then
            echo "Using previously verified Expo Kotlin inline module mirror"
            exit 0
          fi
          exec "$STELLA_REAL_NODE" "$@"
          SH
          chmod +x "$RUNNER_TEMP/stella-node-shim/node"
          echo "STELLA_REAL_NODE=$REAL_NODE" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/stella-node-shim" >> "$GITHUB_PATH"
      - name: Build standalone APK
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --parallel --console=plain -PreactNativeArchitectures=arm64-v8a
        working-directory: packages/mobile/android
      - name: Rename APK
        run: |
          mkdir -p dist
          cp packages/mobile/android/app/build/outputs/apk/release/app-release.apk "dist/Stella Groq release 0.2.0.apk"
          sha256sum "dist/Stella Groq release 0.2.0.apk" > dist/SHA256SUMS.txt
      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Stella-Groq-Android-APK
          path: dist/*
          if-no-files-found: error
      - name: Publish development release
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-dev-${GITHUB_RUN_NUMBER}" dist/* --title "Stella Groq Android dev ${GITHUB_RUN_NUMBER}" --notes "Compilação experimental automática. O backend original ainda não foi substituído e a Groq ainda não está integrada à interface principal. Não use como versão estável." --prerelease
